version: 1
backend:
  phases:
    preBuild:
      commands:
        - "nvm install 22"
        - "nvm use 22"
        - "npm install"
        - "echo 'Node version: $(node --version)'"
        - "echo 'npm version: $(npm --version)'"
        - "echo 'ampx version: $(npx ampx --version)'"
        - "echo 'Current directory: $(pwd)'"
        - "echo 'Directory contents: $(ls -la)'"
        - "echo 'Amplify directory contents: $(ls -la amplify)'"
        - "echo 'Amplify auth directory contents: $(ls -la amplify/auth)'"
        - "echo 'Amplify data directory contents: $(ls -la amplify/data)'"
        - "echo 'Amplify functions directory contents: $(ls -la amplify/functions)'"
        - "echo 'Backend file contents: $(cat amplify/backend.ts || echo 'Failed to read backend.ts')'"
        - "echo 'Auth resource contents: $(cat amplify/auth/resource.ts || echo 'Failed to read auth/resource.ts')'"
        - "echo 'Data resource contents: $(cat amplify/data/resource.ts || echo 'Failed to read data/resource.ts')'"
        - "echo 'Functions resource contents: $(cat amplify/functions/resource.ts || echo 'Failed to read functions/resource.ts')'"
        - "echo 'Functions handler contents: $(cat amplify/functions/handler.ts || echo 'Failed to read functions/handler.ts')'"
        - "echo 'Permissions for .amplify directory: $(ls -ld .amplify)'"
        - "mkdir -p .amplify/artifacts/cdk.out"
        - "chmod -R 755 .amplify"
        - "echo 'Permissions for .amplify/artifacts/cdk.out: $(ls -ld .amplify/artifacts/cdk.out)'"
        - "echo 'Environment variables: $(env)'"
        - "echo 'Checking for GOOGLE_CLIENT_ID: $(echo $GOOGLE_CLIENT_ID || echo 'Not set')'"
        - "echo 'Checking for GOOGLE_CLIENT_SECRET: $(echo $GOOGLE_CLIENT_SECRET || echo 'Not set')'"
        - "echo 'Installed dependencies: $(npm list --depth=0)'"
        - "echo 'Running dry-run synthesis to debug:'"
        - "npx ampx sandbox --dry-run --debug || echo 'Dry-run synthesis failed'"
    build:
      commands:
        - "npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug"
frontend:
  phases:
    preBuild:
      commands:
        - "npm install"
    build:
      commands:
        - "npm run build"
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - "node_modules/**/*"